[package]
name = "gh-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "GitHub App credential wrapper for the GitHub CLI and git"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
