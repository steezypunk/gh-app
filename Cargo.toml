[package]
name = "gh-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "GitHub App credential wrapper for the GitHub CLI and git"
readme = "README.md"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
http = "1"
libc = "0.2"
ring = "0.17"
rsa = { version = "0.9", features = ["pem"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
